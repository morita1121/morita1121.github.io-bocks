<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>最近の体験 — 海に行きました</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol&family=Zen+Maru+Gothic:wght@400;500;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#CDEFFA;
    --sky-mid:#9FDCEE;
    --sea:#2E9CC7;
    --sea-deep:#146B94;
    --foam:#FFFFFF;
    --sand:#FFF9EC;
    --sand-line:#EADFC2;
    --ink:#1C3A44;
    --ink-soft:#5C7A83;
    --sun:#FFC857;
    --coral:#FF8F70;
    --susuki:#D9C08A;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sea) 100%);
    min-height:100vh;
  }

  /* ============ 空のエリア：太陽・雲・かもめ ============ */
  .sky{
    position:relative;
    height:280px;
    overflow:hidden;
  }
  .sun{
    position:absolute; top:38px; right:14%;
    width:80px; height:80px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #FFE9B0, var(--sun));
    box-shadow:0 0 0 14px rgba(255,200,87,.18);
  }
  .cloud{
    position:absolute; background:#fff; border-radius:999px; opacity:.9;
  }
  .gull{
    position:absolute; font-size:20px; color:var(--sea-deep); opacity:.55;
  }

  h1.page-title{
    position:relative; z-index:2;
    text-align:center;
    font-family:'Kaisei Decol', serif;
    font-weight:700;
    font-size:clamp(28px, 5vw, 40px);
    color:var(--ink);
    margin:60px 0 0;
    letter-spacing:.04em;
  }
  .page-title-en{
    display:block; text-align:center; z-index:2; position:relative;
    font-family:'Quicksand', sans-serif; font-weight:600; letter-spacing:.3em;
    font-size:12px; text-transform:uppercase; color:var(--sea-deep); opacity:.75;
    margin-top:10px;
  }

  /* ============ 波の仕切り ============ */
  .wave-divider{display:block; width:100%; margin-top:-2px;}

  /* ============ コンテンツカード ============ */
  main{
    max-width:640px; margin:-20px auto 0; padding:0 20px 80px;
    position:relative; z-index:3;
  }
  .card{
    background:var(--sand);
    border-radius:26px;
    padding:44px 40px 40px;
    box-shadow:0 18px 40px rgba(20,107,148,.18);
    position:relative;
  }
  .tag-row{
    display:flex; justify-content:center; gap:10px; margin-bottom:22px; flex-wrap:wrap;
  }
  .tag{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'Quicksand', sans-serif; font-weight:600; font-size:12.5px;
    background:#fff; color:var(--sea-deep); border:1px solid var(--sand-line);
    padding:6px 14px; border-radius:999px;
  }

  h4.subtitle{
    text-align:center; margin:0 0 18px;
    font-family:'Kaisei Decol', serif; font-weight:700;
    font-size:19px; color:var(--sea-deep);
  }

  .divider{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin:0 0 26px; color:var(--sea); opacity:.55;
  }
  .divider span{font-size:13px;}
  .divider::before, .divider::after{
    content:""; flex:1; height:1px;
    background:linear-gradient(90deg, transparent, var(--sand-line), transparent);
  }

  p.ruled-line {
    font-size:18px;
    line-height:2.4;
    color:var(--ink);
    background-image:linear-gradient(180deg, var(--sand-line) 1px, transparent 1px);
    background-size:100% 2.4em;
    background-position:bottom 2px center;
    margin:0 0 30px;
  }

  .illustration{
    display:flex; justify-content:center; margin-bottom:6px;
  }

  /* ============ ポラロイド風写真 ============ */
  .photo-wrap{
    display:flex; justify-content:center;
    margin:6px 0 34px;
  }
  .polaroid{
    background:#fff;
    padding:12px 12px 34px;
    border-radius:6px;
    box-shadow:0 14px 26px rgba(20,107,148,.22);
    transform:rotate(-2deg);
    max-width:320px;
  }
  .polaroid img{
    display:block;
    width:100%;
    height:auto;
    border-radius:2px;
  }
  .polaroid .caption{
    text-align:center;
    font-family:'Kaisei Decol', serif;
    font-size:13px;
    color:var(--ink-soft);
    margin-top:10px;
  }

  footer{
    text-align:center; margin-top:26px;
    font-family:'Quicksand', sans-serif; font-size:12.5px; color:var(--ink-soft);
  }

  /* ============ 下部の海 ============ */
  .sea-footer{
    height:60px;
    background:linear-gradient(180deg, var(--sea), var(--sea-deep));
  }
</style>
</head>
<body>

<div class="sky">
  <div class="sun"></div>
  <div class="cloud" style="width:90px;height:26px;top:50px;left:8%;"></div>
  <div class="cloud" style="width:60px;height:18px;top:66px;left:13%;"></div>
  <div class="cloud" style="width:70px;height:20px;top:100px;left:70%;"></div>
  <div class="gull" style="top:90px;left:35%;">〜</div>
  <div class="gull" style="top:70px;left:40%;">〜</div>
  <div class="gull" style="top:130px;left:60%;">〜</div>

  <h1 class="page-title">最近の体験</h1>
  <div class="page-title-en">a little summer memo</div>

  <svg class="wave-divider" viewBox="0 0 1440 120" preserveAspectRatio="none" style="position:absolute; bottom:-2px; left:0; height:110px;">
    <path fill="#CDEFFA" opacity="0.55" d="M0,60 C240,110 480,10 720,50 C960,90 1200,20 1440,60 L1440,120 L0,120 Z"></path>
    <path fill="#9FDCEE" opacity="0.75" d="M0,80 C240,40 480,110 720,80 C960,50 1200,100 1440,70 L1440,120 L0,120 Z"></path>
  </svg>
</div>

<main>
  <div class="card">
    <div class="illustration">
      <svg width="120" height="90" viewBox="0 0 160 120" role="img" aria-label="自転車で海沿いの道を走るイラスト">
        <!-- すすき -->
        <g stroke="#D9C08A" stroke-width="2" fill="none" stroke-linecap="round">
          <path d="M18 100 C 16 80, 22 65, 14 50"></path>
          <path d="M18 100 C 20 82, 14 68, 20 52"></path>
          <path d="M18 100 C 18 78, 26 66, 24 50"></path>
        </g>
        <g stroke="#D9C08A" stroke-width="2" fill="none" stroke-linecap="round">
          <path d="M142 102 C 144 84, 138 70, 146 56"></path>
          <path d="M142 102 C 140 86, 146 72, 140 56"></path>
        </g>
        <!-- 道 -->
        <path d="M0 104 L160 104" stroke="#EADFC2" stroke-width="10"></path>
        <!-- 自転車 -->
        <g transform="translate(48,58)">
          <circle cx="10" cy="38" r="14" fill="none" stroke="#146B94" stroke-width="3"></circle>
          <circle cx="52" cy="38" r="14" fill="none" stroke="#146B94" stroke-width="3"></circle>
          <path d="M10 38 L30 14 L52 38 M30 14 L24 38 M10 38 L36 38" stroke="#146B94" stroke-width="3" fill="none" stroke-linejoin="round"></path>
          <path d="M24 14 L38 14" stroke="#146B94" stroke-width="3" stroke-linecap="round"></path>
          <circle cx="24" cy="12" r="4" fill="#FF8F70"></circle>
        </g>
        <!-- 海と空のライン -->
        <path d="M0 108 Q80 100 160 108" stroke="#2E9CC7" stroke-width="2" fill="none" opacity="0.6"></path>
      </svg>
    </div>

    <div class="tag-row">
      <span class="tag">🚲 自転車</span>
      <span class="tag">🌾 すすき道</span>
      <span class="tag">🌊 海</span>
      <span class="tag">📷 写真</span>
    </div>

    <h4 class="subtitle">海に行きました</h4>
    <div class="divider"><span>〜　・　〜</span></div>

    <p class="ruled-line">
      　　　気晴らしに一人で自転車に乗って海に行きました。グーグルマップの言うとおりに走っていたらすすきが生い茂る道を走らされたので、本当に海に着くか不安でした。海の写真も結構撮れました。
    </p>
